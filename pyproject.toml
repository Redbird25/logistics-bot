[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-bot"
version = "0.1.0"
description = "Telegram logistics aggregator MVP"
readme = "README.md"
authors = [{name = "Logistics Bot Team"}]
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.5",
    "fastapi>=0.111",
    "httpx>=0.27",
    "loguru>=0.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "redis>=5.0",
    "SQLAlchemy>=2.0",
    "asyncpg>=0.29",
    "telethon>=1.34",
    "tenacity>=8.2",
    "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = [
    "black>=24.3",
    "isort>=5.13",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src"]
select = ["E", "F", "I", "N", "UP", "S"]
ignore = ["E501"]

[tool.black]
line-length = 100
include = "src"

[tool.isort]
profile = "black"
line_length = 100

